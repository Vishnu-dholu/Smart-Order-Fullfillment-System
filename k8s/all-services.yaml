# ==========================================
# 🐹 WAREHOUSE SERVICE
# ==========================================
apiVersion: v1
kind: Service
metadata: { name: warehouse-service, namespace: smart-order }
spec:
  selector: { app: warehouse-service }
  ports: [{ port: 8084, targetPort: 8084 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: warehouse-service, namespace: smart-order }
spec:
  replicas: 1
  selector: { matchLabels: { app: warehouse-service } }
  template:
    metadata: { labels: { app: warehouse-service } }
    spec:
      containers:
        - name: warehouse-service
          image: parva04/warehouse-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8084 }]
          envFrom: [{ secretRef: { name: smart-order-secrets } }]
          env:
            - name: DB_URL
              valueFrom: { secretKeyRef: { name: smart-order-secrets, key: WAREHOUSE_DB_URL } }
            - name: CORS_ALLOWED_ORIGINS
              value: 'http://localhost,http://localhost:5173,http://localhost:8080,http://localhost:8888'
            - name: INVENTORY_SERVICE_URL
              value: 'http://inventory-service:8082'
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: smart-order-secrets, key: INTERNAL_SERVICE_TOKEN } }
---
