# ==========================================
# 🛡️ API GATEWAY
# ==========================================
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: smart-order }
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: smart-order }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: parva04/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: smart-order-secrets } }]
          env:
            - name: AUTH_SERVICE_URL
              value: 'http://auth-service:8081'
            - name: INVENTORY_SERVICE_URL
              value: 'http://inventory-service:8082'
            - name: ORDER_SERVICE_URL
              value: 'http://order-service:8083'
            - name: WAREHOUSE_SERVICE_URL
              value: 'http://warehouse-service:8084'
---
# ==========================================
# ☕ AUTH SERVICE
# ==========================================
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: smart-order }
spec:
  selector: { app: auth-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: smart-order }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: parva04/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          envFrom: [{ secretRef: { name: smart-order-secrets } }]
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom: { secretKeyRef: { name: smart-order-secrets, key: AUTH_DB_URL } }
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: smart-order-secrets, key: INTERNAL_SERVICE_TOKEN } }
---
