apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smart-order

resources:
  - namespace.yaml
  - all-services.yaml
  - ingress.yaml

# Secrets are managed by Ansible (k8s_secrets role) via kubectl create secret.
# The secretGenerator has been removed to avoid conflicts with Ansible-managed secrets.
# Image tags are set by Ansible (k8s_deploy role) via kubectl set image.
