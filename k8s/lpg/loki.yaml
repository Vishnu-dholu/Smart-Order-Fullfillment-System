apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: smart-order
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: smart-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:2.9.0
        args:
          - "-config.file=/etc/loki/local-config.yaml"
        ports:
          - containerPort: 3100
        resources:
          limits:
            memory: 256Mi
          requests:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: smart-order
spec:
  ports:
    - port: 3100
      targetPort: 3100
  selector:
    app: loki
