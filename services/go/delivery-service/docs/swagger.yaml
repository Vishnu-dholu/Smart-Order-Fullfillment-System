basePath: /
definitions:
  handlers.CreateDeliveryRequest:
    properties:
      order_id:
        type: string
      origin_warehouse:
        type: string
    required:
    - order_id
    - origin_warehouse
    type: object
  handlers.UpdateStatusRequest:
    properties:
      current_location:
        type: string
      status:
        type: string
    required:
    - current_location
    - status
    type: object
  models.Shipment:
    properties:
      created_at:
        type: string
      current_location:
        type: string
      estimated_delivery:
        type: string
      id:
        type: string
      order_id:
        type: string
      status:
        type: string
      tracking_number:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8085
info:
  contact: {}
  description: API for managing deliveries
  title: Delivery Service API
  version: "1.0"
paths:
  /deliveries:
    post:
      consumes:
      - application/json
      description: Called when Warehouse clicks "Ship Order"
      parameters:
      - description: Delivery Request Data
        in: body
        name: delivery
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateDeliveryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Shipment'
      summary: Create a new delivery record
      tags:
      - delivery
  /deliveries/{trackingNumber}/status:
    put:
      consumes:
      - application/json
      description: Update delivery status (For the Delivery Driver / System)
      parameters:
      - description: Tracking Number
        in: path
        name: trackingNumber
        required: true
        type: string
      - description: Status Update Data
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Shipment'
      summary: Update delivery status
      tags:
      - delivery
  /deliveries/order/{orderId}:
    get:
      description: Get delivery status by Order ID (For the Customer UI)
      parameters:
      - description: Order ID
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Shipment'
      summary: Get delivery status
      tags:
      - delivery
swagger: "2.0"
