server.port=8083
spring.application.name=order-service

# Database
spring.datasource.url=jdbc:postgresql://ep-round-frost-a10slzy6-pooler.ap-southeast-1.aws.neon.tech/order_db?sslmode=require
spring.datasource.username=order_admin
spring.datasource.password=order_admin(123)
spring.datasource.driver-class-name=org.postgresql.Driver

# P1-A: Equalize Database Connection Pool Sizes (HikariCP tuning)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OpenFeign (Timeouts for calling other services)
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}

# Enable histogram buckets for HTTP server requests so histogram_quantile()
# in Prometheus/Grafana can compute accurate P99 latency for Java (Micrometer
# does not emit _bucket metrics by default without this setting).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
