spring.application.name=warehouse-twin
server.port=9084

# --- Database Configuration (Neon) ---
spring.datasource.url=jdbc:postgresql://ep-round-frost-a10slzy6-pooler.ap-southeast-1.aws.neon.tech:5432/warehouse_db?sslmode=require
spring.datasource.username=warehouse_admin
spring.datasource.password=warehouse_admin(123)
spring.datasource.driver-class-name=org.postgresql.Driver

# P1-A: Equalize Database Connection Pool Sizes (HikariCP tuning)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:http://localhost:8082}

# --- Observability ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Enable histogram buckets for HTTP server requests so histogram_quantile()
# in Prometheus/Grafana can compute accurate P99 latency for Java (Micrometer
# does not emit _bucket metrics by default without this setting).
management.metrics.distribution.percentiles-histogram.http.server.requests=true