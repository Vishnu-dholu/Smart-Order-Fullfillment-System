spring.application.name=api-gateway
server.port=8080

management.endpoints.web.exposure.include=health,info

# Route URLs (internal docker network defaults)
services.auth.url=${AUTH_SERVICE_URL:http://auth-service:8081}
services.inventory.url=${INVENTORY_SERVICE_URL:http://inventory-service:8082}
services.order.url=${ORDER_SERVICE_URL:http://order-service:8083}
services.warehouse.url=${WAREHOUSE_SERVICE_URL:http://warehouse-service:8084}

# JWT secret used for signature verification (must match auth-service signer)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Prevent duplicated CORS headers when downstream services also set them.
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST

# Auth service passthrough
spring.cloud.gateway.server.webflux.routes[0].id=auth-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=${services.auth.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# Inventory service passthrough
spring.cloud.gateway.server.webflux.routes[1].id=inventory-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=${services.inventory.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# Order service passthrough
spring.cloud.gateway.server.webflux.routes[2].id=order-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=${services.order.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# Warehouse service passthrough
spring.cloud.gateway.server.webflux.routes[3].id=warehouse-service-route
spring.cloud.gateway.server.webflux.routes[3].uri=${services.warehouse.url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/warehouse/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=2
