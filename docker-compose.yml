version: '3.8'

services:
  # ==========================================
  # ⚛️ FRONTEND
  # ==========================================
  frontend:
    build: ./frontend
    container_name: smart-order-frontend
    ports:
      - '5173:80'
    networks:
      - microservices-net

  # ==========================================
  # ☕ JAVA MICROSERVICES (Spring Boot)
  # ==========================================
  auth-service:
    build: ./services/spring/auth-service
    container_name: auth-service
    ports:
      - '8081:8081'
    networks:
      - microservices-net

  inventory-service:
    build: ./services/spring/inventory-service
    container_name: inventory-service
    ports:
      - '8082:8082'
    networks:
      - microservices-net

  order-service:
    build: ./services/spring/order-service
    container_name: order-service
    ports:
      - '8083:8083'
    environment:
      # Internal Docker-to-Docker communication
      - INVENTORY_SERVICE_URL=http://inventory-service:8082
      - WAREHOUSE_SERVICE_URL=http://warehouse-service:8084
      - DELIVERY_SERVICE_URL=http://delivery-service:8085
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
    networks:
      - microservices-net

  # ==========================================
  # 🐹 GO MICROSERVICES
  # ==========================================
  warehouse-service:
    build: ./services/go/warehouse-service
    container_name: warehouse-service
    ports:
      - '8084:8084'
    environment:
      - INVENTORY_SERVICE_URL=http://inventory-service:8082
      - DB_URL=${WAREHOUSE_DB_URL}
    networks:
      - microservices-net

  delivery-service:
    build: ./services/go/delivery-service
    container_name: delivery-service
    ports:
      - '8085:8085'
    environment:
      - DB_URL=${DELIVERY_DB_URL}
    networks:
      - microservices-net

  notification-service:
    build: ./services/go/notification-service
    container_name: notification-service
    ports:
      - '8086:8086'
    environment:
      - DB_URL=${NOTIFICATION_DB_URL}
    networks:
      - microservices-net

# ==========================================
# 🌐 NETWORKING
# ==========================================
networks:
  microservices-net:
    driver: bridge
