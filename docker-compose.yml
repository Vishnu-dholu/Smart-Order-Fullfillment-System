version: '3.8'

services:
  api-gateway:
    build:
      context: ./services/spring/api-gateway
      network: host
    container_name: api-gateway
    ports:
      - '8080:8080'
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - INVENTORY_SERVICE_URL=http://inventory-service:8082
      - ORDER_SERVICE_URL=http://order-service:8083
      - WAREHOUSE_SERVICE_URL=http://warehouse-service:8084
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      - auth-service
      - inventory-service
      - order-service
      - warehouse-service
    networks:
      - microservices-net

  # ==========================================
  # ⚛️ FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./frontend
      network: host
      args:
        - VITE_API_GATEWAY_URL=http://localhost:8080
        - VITE_GOOGLE_CLIENT_ID=100140761576-sf690h9fall536r74p2oehesh5q42qr3.apps.googleusercontent.com
    container_name: smart-order-frontend
    ports:
      - '5173:8080'
    networks:
      - microservices-net

  # ==========================================
  # ☕ JAVA MICROSERVICES (Spring Boot)
  # ==========================================
  auth-service:
    build:
      context: ./services/spring/auth-service
      network: host
    container_name: auth-service
    ports:
      - '8081:8081'
    networks:
      - microservices-net

  inventory-service:
    build:
      context: ./services/spring/inventory-service
      network: host
    container_name: inventory-service
    ports:
      - '8082:8082'
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-smartfill-internal-token}
    networks:
      - microservices-net

  order-service:
    build:
      context: ./services/spring/order-service
      network: host
    container_name: order-service
    ports:
      - '8083:8083'
    environment:
      # Internal Docker-to-Docker communication
      - INVENTORY_SERVICE_URL=http://inventory-service:8082
      - WAREHOUSE_SERVICE_URL=http://warehouse-service:8084
      - DELIVERY_SERVICE_URL=http://delivery-service:8085
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-smartfill-internal-token}
    networks:
      - microservices-net

  # ==========================================
  # 🐹 GO MICROSERVICES
  # ==========================================
  warehouse-service:
    build:
      context: ./services/go/warehouse-service
      network: host
    container_name: warehouse-service
    ports:
      - '8084:8084'
    env_file:
      - ./services/go/warehouse-service/.env
    environment:
      - DB_URL=${WAREHOUSE_DB_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - INVENTORY_SERVICE_URL=http://inventory-service:8082
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-smartfill-internal-token}
    networks:
      - microservices-net

  delivery-service:
    build:
      context: ./services/go/delivery-service
      network: host
    container_name: delivery-service
    ports:
      - '8085:8085'
    env_file:
      - ./services/go/delivery-service/.env
    environment:
      - DATABASE_URL=${DELIVERY_DB_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-smartfill-internal-token}
    networks:
      - microservices-net

  notification-service:
    build:
      context: ./services/go/notification-service
      network: host
    container_name: notification-service
    ports:
      - '8086:8086'
    env_file:
      - ./services/go/notification-service/.env
    environment:
      - DATABASE_URL=${NOTIFICATION_DB_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-smartfill-internal-token}
    networks:
      - microservices-net

# ==========================================
# 🌐 NETWORKING
# ==========================================
networks:
  microservices-net:
    driver: bridge
