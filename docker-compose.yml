version: '3.8'

services:
  # ==========================================
  # ⚛️ FRONTEND
  # ==========================================
  frontend:
    build: ./frontend
    container_name: smart-order-frontend
    ports:
      - '5173:80'
    networks:
      - microservices-net

  # ==========================================
  # ☕ JAVA MICROSERVICES (Spring Boot)
  # ==========================================
  auth-service:
    build: ./services/spring/auth-service
    container_name: auth-service
    ports:
      - '8081:8081'
    networks:
      - microservices-net

  inventory-service:
    build: ./services/spring/inventory-service
    container_name: inventory-service
    ports:
      - '8082:8082'
    networks:
      - microservices-net
    profiles: ["spring-inventory"]

  inventory-service-twin:
    build: ./services/go/inventory-service-twin
    container_name: inventory-service-twin
    ports:
      - '8082:9082'
    env_file:
      - ./services/go/inventory-service-twin/.env
    networks:
      - microservices-net
    profiles: ["go-inventory"]

  order-service:
    build: ./services/spring/order-service
    container_name: order-service
    ports:
      - '8083:8083'
    environment:
      # Internal Docker-to-Docker communication
      # Default points to Spring inventory-service; override via env when running compose.
      # Spring: INVENTORY_SERVICE_URL=http://inventory-service:8082
      # Go:     INVENTORY_SERVICE_URL=http://inventory-service-twin:9082
      - INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:-http://inventory-service:8082}
      # Default points to Go service; override via env when running compose.
      # Go:     WAREHOUSE_SERVICE_URL=http://warehouse-service:8084
      # Spring:  WAREHOUSE_SERVICE_URL=http://warehouse-service-twin:9084
      - WAREHOUSE_SERVICE_URL=${WAREHOUSE_SERVICE_URL:-http://warehouse-service:8084}
      - DELIVERY_SERVICE_URL=http://delivery-service:8085
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
    networks:
      - microservices-net

  warehouse-service-twin:
    build: ./services/spring/warehouse-service-twin
    container_name: warehouse-service-twin
    ports:
      - '8084:9084'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ep-round-frost-a10slzy6-pooler.ap-southeast-1.aws.neon.tech/warehouse_db?sslmode=require
      - SPRING_DATASOURCE_USERNAME=warehouse_admin
      - SPRING_DATASOURCE_PASSWORD=warehouse_admin(123)
      - INVENTORY_SERVICE_URL=http://inventory-service:8082
    networks:
      - microservices-net
    profiles: ["spring"]

  # ==========================================
  # 🐹 GO MICROSERVICES
  # ==========================================
  warehouse-service:
    build: ./services/go/warehouse-service
    container_name: warehouse-service
    ports:
      - '8084:8084'
    env_file:
      - ./services/go/warehouse-service/.env
    environment:
      - INVENTORY_SERVICE_URL=http://inventory-service:8082
    networks:
      - microservices-net
    profiles: ["go"]

  delivery-service:
    build: ./services/go/delivery-service
    container_name: delivery-service
    ports:
      - '8085:8085'
    env_file:
      - ./services/go/delivery-service/.env
    networks:
      - microservices-net

  notification-service:
    build: ./services/go/notification-service
    container_name: notification-service
    ports:
      - '8086:8086'
    env_file:
      - ./services/go/notification-service/.env
    networks:
      - microservices-net

# ==========================================
# 🌐 NETWORKING
# ==========================================
networks:
  microservices-net:
    driver: bridge
