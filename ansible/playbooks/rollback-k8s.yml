---
- name: Roll back Kubernetes deployments to previous revision
  hosts: k8s_nodes
  become: false
  gather_facts: false
  vars:
    target_env: "{{ target_env | default('dev') }}"
  vars_files:
    - "../group_vars/all/main.yml"
    - "../group_vars/{{ target_env }}/main.yml"
  roles:
    - role: k8s_preflight
    - role: k8s_rollback
    - role: k8s_verify
