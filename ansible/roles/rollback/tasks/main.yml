---
- name: Check previous release symlink
  ansible.builtin.stat:
    path: "{{ compose_previous_link }}"
  register: previous_release_stat

- name: Abort rollback when previous release missing
  ansible.builtin.fail:
    msg: "No previous release link found. Rollback is not possible."
  when:
    - rollback_enabled
    - not previous_release_stat.stat.exists

- name: Stop current compose stack
  ansible.builtin.command:
    cmd: docker compose down
    chdir: "{{ compose_project_dir }}"
  when: rollback_enabled
  changed_when: true

- name: Restore previous release as current
  ansible.builtin.file:
    src: "{{ compose_previous_link }}"
    dest: "{{ compose_current_link }}"
    state: link
    force: true
  when: rollback_enabled

- name: Start compose stack from restored release
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ compose_project_dir }}"
  when: rollback_enabled
  changed_when: true
