---
# Create or update the Kubernetes secret from Ansible Vault variables.
# Using --dry-run=client | kubectl apply ensures idempotency (create or update).

- name: Create smart-order-secrets from Ansible Vault variables
  ansible.builtin.shell: |
    kubectl create secret generic {{ k8s_secret_name }} \
      --namespace={{ k8s_namespace }} \
      --from-literal=JWT_SECRET="$VAULT_JWT_SECRET" \
      --from-literal=INTERNAL_SERVICE_TOKEN="$VAULT_INTERNAL_SERVICE_TOKEN" \
      --from-literal=AUTH_DB_URL="$VAULT_AUTH_DB_URL" \
      --from-literal=ORDER_DB_URL="$VAULT_ORDER_DB_URL" \
      --from-literal=INVENTORY_DB_URL="$VAULT_INVENTORY_DB_URL" \
      --from-literal=WAREHOUSE_DB_URL="$VAULT_WAREHOUSE_DB_URL" \
      --from-literal=DELIVERY_DB_URL="$VAULT_DELIVERY_DB_URL" \
      --from-literal=NOTIFICATION_DB_URL="$VAULT_NOTIFICATION_DB_URL" \
      --from-literal=SMTP_EMAIL="$VAULT_SMTP_EMAIL" \
      --from-literal=SMTP_PASSWORD="$VAULT_SMTP_PASSWORD" \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    VAULT_JWT_SECRET: "{{ vault_jwt_secret }}"
    VAULT_INTERNAL_SERVICE_TOKEN: "{{ vault_internal_service_token }}"
    VAULT_AUTH_DB_URL: "{{ vault_auth_db_url }}"
    VAULT_ORDER_DB_URL: "{{ vault_order_db_url }}"
    VAULT_INVENTORY_DB_URL: "{{ vault_inventory_db_url }}"
    VAULT_WAREHOUSE_DB_URL: "{{ vault_warehouse_db_url }}"
    VAULT_DELIVERY_DB_URL: "{{ vault_delivery_db_url }}"
    VAULT_NOTIFICATION_DB_URL: "{{ vault_notification_db_url }}"
    VAULT_SMTP_EMAIL: "{{ vault_smtp_email }}"
    VAULT_SMTP_PASSWORD: "{{ vault_smtp_password }}"
  changed_when: true
  no_log: true

- name: Verify secret exists
  ansible.builtin.command:
    cmd: kubectl get secret {{ k8s_secret_name }} --namespace={{ k8s_namespace }} -o name
  register: secret_check
  changed_when: false

- name: Show secret verification
  ansible.builtin.debug:
    msg: "Secret '{{ k8s_secret_name }}' is present in namespace '{{ k8s_namespace }}'."
